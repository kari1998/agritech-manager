<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriManager - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
        <div class="flex items-center gap-2 mb-2">
            <span class="text-2xl">🌱</span>
            <h1 class="text-xl font-bold text-emerald-400">AgriManager</h1>
        </div>
        <p class="text-xs text-slate-400 mb-4">Sign in to access your personal farm dashboard.</p>

        <div id="reg-banner" class="hidden mb-4 bg-emerald-950 border border-emerald-700 text-emerald-300 text-xs rounded px-3 py-2">
            Account created! Sign in below to access your workspace.
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded text-sm transition">
                Sign In
            </button>
        </form>

        <p class="text-xs text-slate-400 mt-5 text-center">
            New to AgriManager?
            <a href="/register" class="text-emerald-400 hover:underline font-medium">Create an account</a>
        </p>
    </div>

    <script>
        if (new URLSearchParams(window.location.search).get('registered') === '1') {
            document.getElementById('reg-banner').classList.remove('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('agritech_user_id', String(data.user.user_id));
                window.location.href = '/';
            } else {
                const d = data.detail;
                alert(Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || 'Invalid email or password.'));
            }
        });
    </script>
</body>
</html>
