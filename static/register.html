<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriManager - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
        <div class="flex items-center gap-2 mb-2">
            <span class="text-2xl">🌱</span>
            <h1 class="text-xl font-bold text-emerald-400">AgriManager</h1>
        </div>
        <p class="text-xs text-slate-400 mb-6">Create your farmer account to manage plots, harvests, and finances.</p>

        <form id="register-form" class="space-y-3.5">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Full Name</label>
                <input type="text" id="reg-name" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Email</label>
                <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Location</label>
                    <input type="text" id="reg-location" value="Kenya" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Phone Number</label>
                    <input type="text" id="reg-phone" placeholder="+2547..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Password (min 6 characters)</label>
                <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded text-sm transition">
                Create Account
            </button>
        </form>

        <p class="text-xs text-slate-400 mt-5 text-center">
            Already have an account?
            <a href="/login" class="text-emerald-400 hover:underline font-medium">Sign in</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    location: document.getElementById('reg-location').value,
                    phone_number: document.getElementById('reg-phone').value,
                    password: document.getElementById('reg-password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/login?registered=1';
            } else {
                const d = data.detail;
                alert(Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || 'Registration failed.'));
            }
        });
    </script>
</body>
</html>
